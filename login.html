<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-center">

  <div class="login-box">
    <h1 class="form-title">Restrito</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="admin@portal.com">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" id="login-btn" class="btn-submit">Entrar</button>
      <div id="error-msg" class="form-status" style="color: red;"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
