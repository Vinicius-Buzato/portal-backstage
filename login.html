<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="portal-header">
    <div class="header-left">
      <a href="index.html">
        <img src="imgs/logo.png" alt="Portal Backstage" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
        <span id="fallback-logo" class="fallback-logo" style="display: none;">BACKSTAGE</span>
      </a>
    </div>
  </header>

  <main class="page-center">
    <div class="login-box">
      <h1 class="form-title">Restrito</h1>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="editor@portal.com">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" id="login-btn" class="btn-submit">Entrar</button>
        <div id="error-msg" class="form-status" style="color: #b8292f;"></div>
      </form>
    </div>
  </main>

  <footer class="portal-footer">
    <p>© 2026 Portal Backstage. Todos os direitos reservados.</p>
    <div class="footer-links">
      <a href="index.html">← Voltar para a Capa</a>
      <a href="contato.html">Contato</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
