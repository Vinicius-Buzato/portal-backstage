<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Publicar Matéria - Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="portal-header">
    <a href="index.html">
      <img src="imgs/logo.png" alt="Portal Backstage" class="logo-img" onerror="this.style.display='none';">
    </a>
  </header>

  <div class="form-container">
    <h1 class="form-title" id="form-heading">Nova Matéria</h1>
    <form id="news-form">
      <div class="form-group">
        <label for="title">Título da Manchete</label>
        <input type="text" id="title" required placeholder="Ex: Cultura urbana ganha novo espaço em SP">
      </div>

      <div class="form-group">
        <label for="category">Editoria / Categoria</label>
        <input type="text" id="category" required placeholder="Ex: Cultura, Música, São Paulo">
      </div>

      <div class="form-group">
        <label for="size">Tamanho do Destaque na Capa (Estilo G1)</label>
        <select id="size">
          <option value="span-12">Destaque Máximo (Largura Total)</option>
          <option value="span-8">Destaque Grande (2 colunas)</option>
          <option value="span-6">Destaque Médio</option>
          <option value="span-4">Destaque Compacto (Coluna lateral)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lead">Texto de Apoio (Lead / Subtítulo)</label>
        <textarea id="lead" style="height: 100px;" placeholder="Resumo curto que fisga o leitor..."></textarea>
      </div>

      <div class="form-group">
        <label for="image_file">Upload de Imagem Principal (Máx: 5MB)</label>
        <input type="file" id="image_file" accept="image/*">
        <small class="form-help">Formatos aceitos: JPG, PNG, WEBP. Limite de segurança: 5 Megabytes.</small>
      </div>

      <div class="form-group">
        <label for="image_caption">Legenda da Imagem e Créditos</label>
        <input type="text" id="image_caption" placeholder="Foto: Divulgação / Arquivo Backstage">
      </div>

      <div class="form-group">
        <label for="content">Texto Completo da Matéria</label>
        <textarea id="content" required placeholder="Escreva o texto aqui..."></textarea>
        <small class="form-help">
          <b>Dicas de formatação:</b> <code>&lt;h3&gt;Subtítulo&lt;/h3&gt;</code> | <code>&lt;strong&gt;Negrito&lt;/strong&gt;</code> | <code>&lt;blockquote&gt;Citação&lt;/blockquote&gt;</code>
        </small>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">Publicar Matéria no Ar</button>
      <div id="status-message" class="form-status"></div>
    </form>
  </div>

  <footer class="portal-footer">
    <p>© 2026 Portal Backstage. Todos os direitos reservados.</p>
    <a href="index.html">← Voltar para a Capa</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="publicar.js"></script>
</body>
</html>
