<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Matéria - Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="form-container">
    <h1 class="form-title">Nova Matéria - Backstage</h1>
    <form id="news-form">
      <div class="form-group">
        <label for="title">Título da Manchete</label>
        <input type="text" id="title" required placeholder="Ex: Cultura urbana ganha novo espaço em SP">
      </div>

      <div class="form-group">
        <label for="category">Editoria / Categoria</label>
        <input type="text" id="category" required placeholder="Ex: Música, Cultura, São Paulo">
      </div>

      <div class="form-group">
        <label for="size">Tamanho do Destaque na Capa (Estilo G1)</label>
        <select id="size">
          <option value="span-12">Destaque Máximo (Largura Total)</option>
          <option value="span-8">Destaque Grande (2 colunas)</option>
          <option value="span-6">Destaque Médio</option>
          <option value="span-4">Destaque Compacto (Coluna lateral)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lead">Texto de Apoio (Subtítulo / Lead)</label>
        <textarea id="lead" placeholder="Resumo curto que fisga o leitor..."></textarea>
      </div>

      <div class="form-group">
        <label for="image_url">Link da Imagem Principal</label>
        <input type="url" id="image_url" placeholder="https://exemplo.com/foto.jpg">
      </div>

      <div class="form-group">
        <label for="image_caption">Legenda da Imagem e Créditos</label>
        <input type="text" id="image_caption" placeholder="Foto: Divulgação / Arquivo">
      </div>

      <div class="form-group">
        <label for="content">Texto Completo da Matéria</label>
        <textarea id="content" required style="height: 200px;" placeholder="Escreva a matéria aqui..."></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">Publicar Matéria no Ar</button>
      <div id="status-message" class="form-status"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="publicar.js"></script>
</body>
</html>
