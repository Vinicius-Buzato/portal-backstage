<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">

    <!-- Favicon na aba do navegador -->
  <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon.png">
  <link rel="shortcut icon" href="imgs/favicon.png">
  <link rel="apple-touch-icon" href="imgs/favicon.png">

  <!-- Descrição padrão da página -->
  <meta name="description" content="Cobertura cultural, bastidores, artes, cinema e música no Portal Backstage.">

  <!-- Open Graph (WhatsApp, Telegram, LinkedIn, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Portal Backstage">
  <meta property="og:title" content="Portal Backstage">
  <meta property="og:description" content="Cobertura cultural, bastidores, artes, cinema e música no Portal Backstage.">
  <meta property="og:image" content="https://portal-backstage.vercel.app/imgs/og-preview.png">
  <meta property="og:url" content="https://portal-backstage.vercel.app">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Portal Backstage">
  <meta name="twitter:description" content="Cobertura cultural, bastidores, artes, cinema e música no Portal Backstage.">
  <meta name="twitter:image" content="https://portal-backstage.vercel.app/imgs/og-preview.png">
</head>
<body>

  <header class="portal-header">
    <div class="header-left">
      <a href="index.html">
        <img src="imgs/logo.png" alt="Portal Backstage" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
        <span id="fallback-logo" class="fallback-logo" style="display: none;">BACKSTAGE</span>
      </a>
    </div>

    <nav class="portal-nav" id="main-nav">
      <div class="nav-group">
        <button type="button" class="nav-link active" data-view="noticias" data-category="TODAS">Notícias</button>

        <div class="dropdown-wrapper">
          <button type="button" class="nav-link" id="editoriais-toggle">Editoriais ▾</button>
          <div class="dropdown-menu" id="editoriais-menu">
            <span class="dropdown-item" data-category="ARTES">Artes</span>
            <span class="dropdown-item" data-category="CINEMA">Cinema</span>
            <span class="dropdown-item" data-category="MÚSICA">Música</span>
          </div>
        </div>

        <button type="button" class="nav-link" data-view="equipe">Equipe</button>
        <button type="button" class="nav-link" data-view="redes">Redes Sociais</button>
      </div>

      <div id="editor-nav-container"></div>
    </nav>
  </header>

  <main class="portal-container" id="main-content">
    <p style="grid-column: span 12; text-align: center; font-family: var(--font-title);">Carregando edições...</p>
  </main>

  <footer class="portal-footer">
    <p>© 2026 Portal Backstage. Todos os direitos reservados.</p>
    <div class="footer-links">
      <a href="contato.html">Contato</a>
      <span id="footer-auth-link">
        <a href="login.html">Área Restrita (Redação)</a>
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
