<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="portal-header">
    <h1 class="portal-logo">Backstage</h1>
  </header>

  <nav class="portal-nav">
    <span>Cultura</span>
    <span>Música</span>
    <span>São Paulo</span>
    <span>Agenda</span>
  </nav>

  <main class="portal-container" id="news-grid">
    <!-- As notícias do CMS serão inseridas aqui automaticamente -->
    <p style="grid-column: span 12; text-align: center;">Carregando edições...</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
