<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Backstage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="portal-header">
    <a href="index.html">
      <img src="imgs/logo.png" alt="Portal Backstage" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
      <h1 id="fallback-logo" style="display:none; color: #5B2A86; font-family: 'Archivo Black';">BACKSTAGE</h1>
    </a>
  </header>

  <nav class="portal-nav" id="category-nav">
    <div id="category-buttons-container" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
      <span class="nav-link active" data-category="TODAS">Todas</span>
    </div>
    <div id="editor-nav-container"></div>
  </nav>

  <main class="portal-container" id="news-grid">
    <p style="grid-column: span 12; text-align: center; font-family: var(--font-title);">Carregando edições...</p>
  </main>

  <footer class="portal-footer">
    <p>© 2026 Portal Backstage. Todos os direitos reservados.</p>
    <div id="footer-auth-link">
      <a href="login.html">Área Restrita (Redação)</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
